{% extends "base.html" %}{% block title %}Tap2Sip | Inventory{% endblock %}
{% block content %}<div class="admin-shell"><aside class="sidebar"><div class="brand">☕ Tap2Sip</div><a href="{{url_for('admin_dashboard')}}">Dashboard</a><a href="{{url_for('admin_orders')}}">Orders</a><a href="{{url_for('admin_products')}}">Products</a><a class="active" href="{{url_for('admin_inventory')}}">Inventory</a><a href="{{url_for('admin_reports')}}">Reports</a><a href="{{url_for('admin_logout')}}">Logout</a></aside><section class="admin-main"><div class="admin-head"><div><div class="eyebrow">STOCK</div><h1>Inventory</h1></div></div><div class="inventory-grid">{% for x in inventory %}<div class="inventory-card {% if x.quantity<=x.minimum_quantity %}low{% endif %}"><div class="inv-top"><h3>{{x.ingredient}}</h3><span>{{x.quantity}}{{x.unit}}</span></div><div class="progress"><i style="width:{{x.quantity}}%"></i></div><form method="post" action="{{url_for('admin_inventory_update',item_id=x.id)}}" class="inv-form"><label>Stock<input type="number" step="0.1" name="quantity" value="{{x.quantity}}"></label><label>Minimum<input type="number" step="0.1" name="minimum_quantity" value="{{x.minimum_quantity}}"></label><button class="secondary-btn tiny">UPDATE</button></form></div>{% endfor %}</div></section></div>{% endblock %}
